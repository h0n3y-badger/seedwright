plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.version
group = project.group
base { archivesName = 'seedwright-oracle' }

// 26.3+ uses the new float noise/density API ("modern"); 1.21.1-26.2 share the "legacy" one.
// Obfuscated versions (1.21.x) need the remapping Loom plugin: see ../oracle-legacy.
def legacy = project.hasProperty('legacy')
sourceSets.main.java.srcDirs = ['src/common/java', legacy ? 'src/legacy/java' : 'src/modern/java']

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
	runs {
		server {
			vmArgs "-Xmx6G"
			if (project.hasProperty("oracle")) vmArgs((project.property("oracle") as String).split(" ").collect { "-Dseedwright.oracle." + it })
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}
java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
