// Legacy oracle for obfuscated versions (1.21.x): same sources as ../oracle, remapping Loom + Mojang mappings.
plugins {
	id 'fabric-loom' version "${loom_version}"
}
version = project.version
group = project.group
base { archivesName = 'seedwright-oracle-legacy' }
sourceSets.main.java.srcDirs = ['../oracle/src/common/java', '../oracle/src/legacy/java']
sourceSets.main.resources.srcDirs = ['../oracle/src/main/resources']
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}
loom {
	runs {
		server {
			vmArgs "-Xmx6G"
			if (project.hasProperty("oracle")) vmArgs((project.property("oracle") as String).split(" ").collect { "-Dseedwright.oracle." + it })
		}
	}
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = "UTF-8" }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
